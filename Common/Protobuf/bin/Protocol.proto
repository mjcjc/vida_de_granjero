syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{ 
	string accountId = 1;
	string password = 2;
}

message S_LOGIN
{
	bool success = 1;
	repeated Player players = 2;
}

message C_ENTER_GAME
{
	uint64 playerindex = 1;
	bool GameStart = 2;
}

message S_ENTER_GAME
{
	uint64 playerid = 1;	
	bool success = 2;
}
message S_OTHER
{
	repeated Player other = 1;
	uint32 p_size = 2;
}
message C_MOVE
{
	uint64 playerId = 1;
	Player player = 2;
	uint32 sequence = 3;
	uint32 client_tick = 4;
	float input_x = 5;
	float input_z = 6;
	float delta_time = 7;
}

message S_MOVE
{
	uint64 playerId = 1;
	Player player = 2;
	uint32 last_processed_sequence = 3;
	uint32 server_tick = 4;
}
message C_PLACEOBJECTREQ {
  uint32 model_type = 1;      // EObjectModelType (int)
  Transform transform = 2;    // ��ġ�� ������Ʈ�� ��ġ �� ȸ�� ����
  uint32 req_id = 3;          // Ŭ�� ��û �ĺ���
}
message S_OBJECTSPAWN {
  uint64 object_id = 1;       // ������ �߱��� ���� ID
  uint32 model_type = 2;
  Transform transform = 3;
  uint64 owner_player_id = 4;
  uint64 temp_id = 5;         // Ŭ�� ���� �ӽ� ID
}
message S_WORLD_STATE
{
    uint32 season = 1;
    uint32 weather = 2;
    uint32 mission_score = 3;
}
message C_DEBUG_WORLD_STATE_CHANGE
{
    uint32 season = 1;
    uint32 weather = 2;
}
message S_WORLD_INIT
{
	repeated WorldObject objects = 1;
}
message C_GATHER_REQ
{
	uint32 object_id = 1;
}
message C_OBEJCT_HP
{
	uint64 object_id = 1;
	uint64 hp = 2;
}
message S_OBJECT_DESPAWN
{
	uint32 object_id = 1;
	uint32 hp = 2;
	uint32 temp_id = 3;
}

message S_SEEDGROWTH
{
	uint32 object_id = 1;
	Transform transform = 2;
	uint32 growth = 3;
}
message C_SEEDGROWTH
{
	uint32 object_id = 1;
	uint32 CropCheckCell = 2;
}
message C_CROPSTATE
{
	uint64 model_type = 1;
	uint64 object_id = 2;
}
message S_PLAYER_DESPAWN
{
	uint64 playerid =1;
}


