syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{ 
	uint64 accountId = 1;
	uint64 password = 2;
}

message S_LOGIN
{
	bool success = 1;
	repeated Player players = 2;
}

message C_ENTER_GAME
{
	uint64 playerindex = 1;
	bool GameStart = 2;
}

message S_ENTER_GAME
{
	uint64 playerid = 1;	
	bool success = 2;
}
message S_OTHER
{
	repeated Player other = 1;
	uint32 p_size = 2;
}
message C_MOVE
{
	uint64 playerId = 1;
	Player player =2;
}

message S_MOVE
{
	uint64 playerId = 1;
	Player player =2;
}
message C_PLACEOBJECTREQ {
  uint32 model_type = 1;      // EObjectModelType (int)
  Transform transform = 2;    // 배치할 오브젝트의 위치 및 회전 정보
  uint32 req_id = 3;          // 클라 요청 식별자
}
message S_OBJECTSPAWN {
  uint64 object_id = 1;       // 서버가 발급한 고유 ID
  uint32 model_type = 2;
  Transform transform = 3;
  uint64 owner_player_id = 4;
  uint64 temp_id = 5;         // 클라가 보낸 임시 ID
}
message S_WORLD_STATE
{
    uint32 season = 1;
    uint32 weather = 2;
    uint32 mission_score = 3;
}
message S_WORLD_INIT
{
	repeated WorldObject objects = 1;
}
message C_GATHER_REQ
{
	uint32 object_id = 1;
}
message C_OBEJCT_HP
{
	uint64 object_id = 1;
	uint64 hp = 2;
}
message S_OBJECT_DESPAWN
{
	uint32 object_id = 1;
	uint32 hp = 2;
	uint32 temp_id = 3;
}

message S_SEEDGROWTH
{
	uint32 object_id = 1;
	Transform transform = 2;
	uint32 growth = 3;
}
message C_SEEDGROWTH
{
	uint32 object_id = 1;
	uint32 CropCheckCell = 2;
}
message C_CROPSTATE
{
	uint64 model_type = 1;
	uint64 object_id = 2;
}
message S_PLAYER_DESPAWN
{
	uint64 playerid =1;
}